[package]
name = "podtalk-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "podtalk_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
whisper-rs = { version = "0.15", default-features = false }
symphonia = { version = "0.5", features = ["mp3", "wav", "aac", "isomp4", "ogg", "vorbis", "flac"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

once_cell = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
